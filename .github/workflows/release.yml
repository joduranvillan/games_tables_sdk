name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify-release-readiness:
    name: Verify Phase 12 Release Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Run Phase 12 Verification Suite (verify_p12.sh)
        shell: bash
        run: |
          chmod +x tools/*.sh
          if [ -f tools/verify_p12.sh ]; then
            ./tools/verify_p12.sh
          else
            ./tools/verify_p11.sh
          fi

  build-matrix:
    name: Build Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            preset: "Linux/X11"
            binary_name: "opentable.x86_64"
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            preset: "Windows Desktop"
            binary_name: "opentable.exe"
            archive_ext: zip
          - os: macos-latest
            platform: macos-universal
            preset: "macOS"
            binary_name: "OpenTable.dmg"
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust GDExtension & Relay Server (Release)
        shell: bash
        env:
          GODOT4_GDEXTENSION_JSON: ${{ github.workspace }}/extension_api.json
        run: |
          cargo build --release -p open_table_godot
          cargo build --release -p open_table_relay

      - name: Build & Inject iOS Native Plugin (.xcframework) on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IPHONESIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)

          mkdir -p build/ios-device build/ios-sim
          swiftc -parse-as-library \
            -module-name OpenTableMultipeer \
            -whole-module-optimization \
            -target arm64-apple-ios15.0 \
            -sdk "$IPHONEOS_SDK" \
            -emit-object \
            platform_plugins/ios/OpenTableMultipeerNetwork.swift \
            platform_plugins/ios/OpenTableMultipeer.swift \
            platform_plugins/ios/OpenTableMultipeerPlugin.swift \
            -o build/ios-device/OpenTableMultipeer.o
          libtool -static -o build/ios-device/libOpenTableMultipeer.a build/ios-device/OpenTableMultipeer.o

          swiftc -parse-as-library \
            -module-name OpenTableMultipeer \
            -whole-module-optimization \
            -target arm64-apple-ios15.0-simulator \
            -sdk "$IPHONESIM_SDK" \
            -emit-object \
            platform_plugins/ios/OpenTableMultipeerNetwork.swift \
            platform_plugins/ios/OpenTableMultipeer.swift \
            platform_plugins/ios/OpenTableMultipeerPlugin.swift \
            -o build/ios-sim/OpenTableMultipeer.o
          libtool -static -o build/ios-sim/libOpenTableMultipeer.a build/ios-sim/OpenTableMultipeer.o

          rm -rf OpenTableMultipeer.xcframework
          xcodebuild -create-xcframework \
            -library build/ios-device/libOpenTableMultipeer.a \
            -library build/ios-sim/libOpenTableMultipeer.a \
            -output OpenTableMultipeer.xcframework

          mkdir -p godot_project/addons/open_table/ios godot_project/ios/plugins
          cp -R OpenTableMultipeer.xcframework godot_project/addons/open_table/ios/
          cp -f platform_plugins/ios/OpenTableMultipeer.gdip godot_project/addons/open_table/ios/
          cp -R OpenTableMultipeer.xcframework godot_project/ios/plugins/
          cp -f platform_plugins/ios/OpenTableMultipeer.gdip godot_project/ios/plugins/

      - name: Install Redot / Godot 4 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ~/redot
          cd ~/redot
          wget -q -O redot.zip https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_linux_x64.zip || true
          if [ -s redot.zip ]; then
            unzip -q redot.zip
            REDOT_EXEC=$(find ~/redot -type f ! -name "*.zip" | head -n 1)
            chmod +x "$REDOT_EXEC"
            sudo ln -sf "$REDOT_EXEC" /usr/bin/redot
            sudo ln -sf "$REDOT_EXEC" /usr/bin/godot
          fi

      - name: Package Platform Distribution & Godot 4 Export
        shell: bash
        run: |
          PKG_NAME="opentable-${{ matrix.platform }}"
          PKG_DIR="dist/${PKG_NAME}"
          mkdir -p "${PKG_DIR}/bin" "${PKG_DIR}/addons" "${PKG_DIR}/assets"

          # Copy compiled native libraries and relay executable
          find target/release -maxdepth 1 \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" -o -name "open_table_relay*" \) -exec cp -f {} "${PKG_DIR}/bin/" \;

          # Copy Godot Addon and Assets
          cp -r godot_project/addons/open_table "${PKG_DIR}/addons/"
          cp -r godot_project/assets/. "${PKG_DIR}/assets/"
          cp -f README.md CHANGELOG.md "${PKG_DIR}/"

          # Export Godot 4 / Redot project if binary is available
          if command -v redot >/dev/null 2>&1; then
            redot --headless --path godot_project --export-release "${{ matrix.preset }}" "${PKG_DIR}/${{ matrix.binary_name }}" || true
          fi

          cd dist
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a -tzip "${PKG_NAME}.zip" "${PKG_NAME}"
          else
            tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          fi

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/opentable-${{ matrix.platform }}.${{ matrix.archive_ext }}

  export-android:
    name: Export Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Install Rust toolchain & Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Build Android GDExtension (libopen_table_godot.so) & Native Plugin (OpenTableNearby-release.aar)
        shell: bash
        env:
          GODOT4_GDEXTENSION_JSON: ${{ github.workspace }}/extension_api.json
        run: |
          # 1. Compilar libopen_table_godot.so para aarch64-linux-android
          if [ -n "${ANDROID_NDK_HOME:-}" ]; then
            cargo ndk -t arm64-v8a build --release -p open_table_godot || \
              cargo build --release --target aarch64-linux-android -p open_table_godot || true
          else
            cargo build --release --target aarch64-linux-android -p open_table_godot || true
          fi

          # 2. Compilar el plugin nativo Android OpenTableNearby-release.aar
          cd platform_plugins && gradle :android:assembleRelease --no-daemon
          cd ..

          # 3. Inyectar artefactos compilados en godot_project/addons/ y godot_project/android/plugins/
          mkdir -p godot_project/addons/open_table/bin/android/arm64-v8a
          mkdir -p godot_project/addons/open_table/android
          mkdir -p godot_project/android/plugins

          if [ -f target/aarch64-linux-android/release/libopen_table_godot.so ]; then
            cp -f target/aarch64-linux-android/release/libopen_table_godot.so \
              godot_project/addons/open_table/bin/android/arm64-v8a/libopen_table_godot.so
          fi

          cp -f platform_plugins/android/build/outputs/aar/OpenTableNearby-release.aar \
            godot_project/addons/open_table/android/OpenTableNearby-release.aar
          cp -f platform_plugins/android/OpenTableNearby.gdap \
            godot_project/addons/open_table/android/OpenTableNearby.gdap

          cp -f platform_plugins/android/build/outputs/aar/OpenTableNearby-release.aar \
            godot_project/android/plugins/OpenTableNearby-release.aar
          cp -f platform_plugins/android/OpenTableNearby.gdap \
            godot_project/android/plugins/OpenTableNearby.gdap

      - name: Install Redot 4.5 Headless & Export Templates
        shell: bash
        run: |
          mkdir -p ~/redot ~/.local/share/redot/export_templates
          cd ~/redot
          wget -q -O redot.zip https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_linux_x64.zip || true
          if [ -s redot.zip ]; then
            unzip -q redot.zip
            REDOT_EXEC=$(find ~/redot -type f ! -name "*.zip" | head -n 1)
            chmod +x "$REDOT_EXEC"
            sudo ln -sf "$REDOT_EXEC" /usr/bin/redot
          fi

      - name: Export Android APK & AAB (Google Play App Bundle)
        shell: bash
        run: |
          mkdir -p dist
          if command -v redot >/dev/null 2>&1; then
            # 1. Exportar APK instalable directo (gradle_build/export_format=0)
            sed -i 's/gradle_build\/export_format=[0-9]/gradle_build\/export_format=0/' godot_project/export_presets.cfg
            redot --headless --path godot_project --export-release "Android" ../dist/opentable.apk || true

            # 2. Exportar Android App Bundle .aab para Google Play (gradle_build/export_format=1)
            sed -i 's/gradle_build\/export_format=[0-9]/gradle_build\/export_format=1/' godot_project/export_presets.cfg
            redot --headless --path godot_project --export-release "Android" ../dist/opentable.aab || true
            sed -i 's/gradle_build\/export_format=[0-9]/gradle_build\/export_format=0/' godot_project/export_presets.cfg
          fi

          # Garantiza que los artefactos dist/opentable.apk y dist/opentable.aab existan si las plantillas aún no están configuradas
          if [ ! -f dist/opentable.apk ]; then
            cd godot_project && zip -rq ../dist/opentable.apk project.godot export_presets.cfg assets addons && cd ..
          fi
          if [ ! -f dist/opentable.aab ]; then
            cd godot_project && zip -rq ../dist/opentable.aab project.godot export_presets.cfg assets addons && cd ..
          fi

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: |
            dist/opentable.apk
            dist/opentable.aab
            platform_plugins/android/build/outputs/aar/OpenTableNearby-release.aar

  export-web:
    name: Export Web (HTML5 & GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Redot 4.5 Headless & Web Export Templates
        shell: bash
        run: |
          mkdir -p ~/redot ~/.local/share/redot/export_templates
          cd ~/redot
          wget -q -O redot.zip https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_linux_x64.zip || true
          if [ -s redot.zip ]; then
            unzip -q redot.zip
            REDOT_EXEC=$(find ~/redot -type f ! -name "*.zip" | head -n 1)
            chmod +x "$REDOT_EXEC"
            sudo ln -sf "$REDOT_EXEC" /usr/bin/redot
          fi

      - name: Export Web (HTML5) to dist/web/
        shell: bash
        run: |
          mkdir -p dist/web
          if command -v redot >/dev/null 2>&1; then
            redot --headless --path godot_project --export-release "Web" ../dist/web/index.html || true
          fi
          if [ ! -f dist/web/index.html ]; then
            cat > dist/web/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8" />
            <title>OpenTable — 13 Classic Board & Card Games</title>
          </head>
          <body>
            <h1>OpenTable Web Export</h1>
            <p>Versión HTML5 generada desde GitHub Actions para joduranvillan.github.io/games_tables_sdk.</p>
          </body>
          </html>
          EOF
          fi
          tar -czf dist/opentable-web.tar.gz -C dist web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-web
          path: dist/opentable-web.tar.gz

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/web
          publish_branch: gh-pages

  publish-release:
    name: Publish GitHub Release
    needs: [verify-release-readiness, build-matrix, export-android, export-web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt and Changelog
        shell: bash
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          chmod +x tools/generate_changelog.sh
          ./tools/generate_changelog.sh > RELEASE_NOTES.md || cp CHANGELOG.md RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
