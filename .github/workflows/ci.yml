name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Rust Workspace (${{ matrix.rust }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Make scripts executable
        run: chmod +x tools/*.sh

      - name: Check MSRV
        run: cargo check --workspace --exclude open_table_godot --ignore-rust-version

      - name: Security Audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Run clippy
        run: cargo clippy --workspace --exclude open_table_godot -- -D warnings

      - name: Run fmt check
        run: cargo fmt --workspace --check

      - name: Run tests
        run: cargo test --workspace --exclude open_table_godot

      - name: Run code quality metrics
        run: ./tools/metrics.sh

      - name: Verify workspace consistency
        run: ./tools/verify_workspace.sh

  build-godot-bridge:
    name: Build Godot Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Make scripts executable
        run: chmod +x tools/*.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Install Redot / Godot
        run: |
          mkdir -p ~/redot
          cd ~/redot
          wget -q -O redot.zip https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_linux_x64.zip || wget -q -O redot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q redot.zip
          REDOT_EXEC=$(find ~/redot -type f ! -name "*.zip" | head -n 1)
          if [ -z "$REDOT_EXEC" ]; then
            echo "ERROR: Could not locate extracted Redot/Godot executable."
            exit 1
          fi
          chmod +x "$REDOT_EXEC"
          sudo ln -sf "$REDOT_EXEC" /usr/bin/redot
          sudo ln -sf "$REDOT_EXEC" /usr/bin/godot

      - name: Build open_table_godot
        run: cargo build -p open_table_godot
        env:
          GODOT_BIN: /usr/bin/godot
          REDOT_BIN: /usr/bin/redot

      - name: Verify .so artifact output
        run: |
          test -f target/debug/libopen_table_godot.so || test -f target/debug/libopen_table_godot.dylib || test -f target/debug/open_table_godot.dll
          echo "Godot bridge artifact produced successfully!"
