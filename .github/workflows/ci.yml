name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Rust Workspace (${{ matrix.rust }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Make scripts executable
        run: chmod +x tools/*.sh

      - name: Check MSRV
        run: cargo check --workspace --exclude open_table_godot --ignore-rust-version

      - name: Security Audit (cargo-deny)
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny check
        run: cargo deny check

      - name: Run clippy
        run: cargo clippy --workspace --exclude open_table_godot -- -D warnings

      - name: Run fmt check
        run: cargo fmt --all --check

      - name: Check doc warnings
        run: cargo doc --workspace --no-deps --exclude open_table_godot 2>&1 | grep "warning:" | { grep . && exit 1 || exit 0; }

      - name: Run tests
        run: cargo test --workspace --exclude open_table_godot

      - name: Install cargo-llvm-cov
        if: matrix.rust == 'stable'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        if: matrix.rust == 'stable'
        run: cargo llvm-cov --workspace --exclude open_table_godot --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: matrix.rust == 'stable'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

      - name: Run code quality metrics
        run: ./tools/metrics.sh

      - name: Verify workspace consistency
        run: ./tools/verify_workspace.sh

      - name: Verify Crates.io Trusted Publishing metadata & dry-run
        if: matrix.rust == 'stable'
        run: ./tools/publish_crates_io.sh --dry-run

  build-godot-bridge:
    name: Build Godot Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Make scripts executable
        run: chmod +x tools/*.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Install Redot / Godot
        run: |
          mkdir -p ~/redot
          cd ~/redot
          wget -q -O redot.zip https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_linux_x64.zip
          if [ ! -s redot.zip ]; then
            echo "ERROR: Failed to download Redot 26.2 (Godot 4.4 compatible). The fallback Godot 4.3 is not supported."
            exit 1
          fi
          unzip -q redot.zip
          REDOT_EXEC=$(find ~/redot -type f ! -name "*.zip" | head -n 1)
          if [ -z "$REDOT_EXEC" ]; then
            echo "ERROR: Could not locate extracted Redot/Godot executable."
            exit 1
          fi
          chmod +x "$REDOT_EXEC"
          sudo ln -sf "$REDOT_EXEC" /usr/bin/redot
          sudo ln -sf "$REDOT_EXEC" /usr/bin/godot

      - name: Build open_table_godot
        run: cargo build -p open_table_godot
        env:
          GODOT_BIN: /usr/bin/godot
          REDOT_BIN: /usr/bin/redot

      - name: Verify .so artifact output
        run: |
          test -f target/debug/libopen_table_godot.so || test -f target/debug/libopen_table_godot.dylib || test -f target/debug/open_table_godot.dll
          echo "Godot bridge artifact produced successfully!"

      - name: Run Godot Headless Smoke Suite (47 tests)
        run: ./tools/run_godot_tests.sh
        env:
          GODOT_BIN: /usr/bin/godot
          REDOT_BIN: /usr/bin/redot

  build-android-plugin:
    name: Build Android Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'
      - name: Build Android Plugin
        run: cd platform_plugins && gradle :android:assembleRelease --no-daemon
        working-directory: .
      - name: Upload OpenTableNearby-release.aar artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenTableNearby-release.aar
          path: platform_plugins/android/build/outputs/aar/OpenTableNearby-release.aar

  build-ios-plugin:
    name: Build iOS Swift Plugin (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Rust toolchain with iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Check Rust crates for iOS target
        run: |
          cargo check -p open_table_core --target aarch64-apple-ios
          cargo check -p open_table_engine --target aarch64-apple-ios
          cargo check -p open_table_transport_native_bridge --target aarch64-apple-ios

      - name: Compile iOS Swift Plugin (Device & Simulator)
        run: |
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          IPHONESIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)

          echo "Compiling Swift plugin for iOS Device (arm64)..."
          swiftc -parse-as-library \
            -module-name OpenTableMultipeer \
            -whole-module-optimization \
            -target arm64-apple-ios15.0 \
            -sdk "$IPHONEOS_SDK" \
            -emit-object \
            platform_plugins/ios/OpenTableMultipeerNetwork.swift \
            platform_plugins/ios/OpenTableMultipeer.swift \
            platform_plugins/ios/OpenTableMultipeerPlugin.swift \
            -o build-ios-device.o

          echo "Compiling Swift plugin for iOS Simulator (arm64)..."
          swiftc -parse-as-library \
            -module-name OpenTableMultipeer \
            -whole-module-optimization \
            -target arm64-apple-ios15.0-simulator \
            -sdk "$IPHONESIM_SDK" \
            -emit-object \
            platform_plugins/ios/OpenTableMultipeerNetwork.swift \
            platform_plugins/ios/OpenTableMultipeer.swift \
            platform_plugins/ios/OpenTableMultipeerPlugin.swift \
            -o build-ios-simulator.o

          mkdir -p build/ios-device build/ios-sim
          libtool -static -o build/ios-device/libOpenTableMultipeer.a build-ios-device.o
          libtool -static -o build/ios-sim/libOpenTableMultipeer.a build-ios-simulator.o

          rm -rf OpenTableMultipeer.xcframework
          xcodebuild -create-xcframework \
            -library build/ios-device/libOpenTableMultipeer.a \
            -library build/ios-sim/libOpenTableMultipeer.a \
            -output OpenTableMultipeer.xcframework

          echo "iOS Swift plugin compiled and packaged into OpenTableMultipeer.xcframework!"

      - name: Upload OpenTableMultipeer.xcframework artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenTableMultipeer.xcframework
          path: OpenTableMultipeer.xcframework

  build-and-test-web-client:
    name: Test & Build React + WASM Web Client (14 Games PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@wasm-bindgen-cli

      - name: Compile open_table_wasm & Generate WebAssembly Bindings
        run: |
          cargo build --manifest-path open_table_wasm/Cargo.toml --target wasm32-unknown-unknown --release
          mkdir -p web_client/public/wasm
          wasm-bindgen --target web --out-dir web_client/public/wasm open_table_wasm/target/wasm32-unknown-unknown/release/open_table_wasm.wasm || \
            cp -f open_table_wasm/target/wasm32-unknown-unknown/release/open_table_wasm.wasm web_client/public/wasm/open_table_wasm_bg.wasm
          test -f web_client/public/wasm/open_table_wasm_bg.wasm

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Web Client Dependencies
        working-directory: web_client
        run: npm install

      - name: Run 14-Games Regression & Phases 1-5 Ecosystem Test Suites
        working-directory: web_client
        run: npm test

      - name: Build Production PWA Bundle (Vite)
        working-directory: web_client
        run: npm run build


