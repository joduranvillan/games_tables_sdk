version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "1"
    open-pull-requests-limit: 3
    groups:
      cargo-all:
        patterns:
          - "*"
    assignees:
      - "joduranvillan"
    reviewers:
      - "joduranvillan"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "1"
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"
    assignees:
      - "joduranvillan"
    reviewers:
      - "joduranvillan"
