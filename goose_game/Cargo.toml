[package]
name = "open_table_goose_game"
version = "1.1.0"
authors = ["joduranvillan"]
edition = "2021"
rust-version = "1.82"
description = "Canonical 63-square Game of the Goose (El Juego de la Oca) engine for OpenTable SDK."
license = "GPL-3.0-or-later"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["game", "board-game", "goose", "oca", "opentable"]
categories = ["game-engines", "games"]
readme = "README.md"

[lib]
name = "goose_game"
path = "src/lib.rs"

[dependencies]
open_table_core = { version = "1.1.0", path = "../open_table_core" }
open_table_engine = { version = "1.1.0", path = "../open_table_engine" }
open_table_macros = { version = "1.1.0", path = "../open_table_macros" }
serde = { version = "1.0", features = ["derive"] }
typetag = "0.2"
bevy_ecs = "0.20"

[dev-dependencies]
serde_json = "1"
