[package]
name = "open_table_engine-fuzz"
version = "1.1.0"
publish = false
edition = "2021"
rust-version = "1.82"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
open_table_engine = { path = "..", version = "0.1.0" }

open_table_core = { path = "../../open_table_core", version = "1.1.0" }

[[bin]]
name = "fuzz_session"
path = "fuzz_targets/fuzz_session.rs"
test = false
doc = false

[workspace]
members = ["."]
