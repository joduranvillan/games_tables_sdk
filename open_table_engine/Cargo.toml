[package]
name = "open_table_engine"
version = "1.0.0"
authors = ["joduranvillan"]
edition = "2021"
rust-version = "1.82"
description = "Motor de OpenTable Engine: bevy_ecs + scheduler + rule engine sobre los contratos de open_table_core."
license = "MIT"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["board-game", "game-engine", "ecs", "sdk", "rules"]
categories = ["game-engines", "game-development"]

[dependencies]
open_table_core = { version = "1.0.0", path = "../open_table_core" }
open_table_macros = { version = "1.0.0", path = "../open_table_macros" }

bevy_ecs = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
flate2 = "1.0"
hmac = "0.13.0"
sha2 = "0.11.0"

[dev-dependencies]
criterion = "0.8"
bincode = { version = "2.0.1" , features = ["serde"] }
backgammon_game = { path = "../backgammon_game" }
checkers_game = { path = "../checkers_game" }
chess_game = { path = "../chess_game" }
chinese_checkers_game = { path = "../chinese_checkers_game" }
crisis_game = { path = "../crisis_game" }
go_game = { path = "../go_game" }
ludo_game = { path = "../ludo_game" }
mille_bornes_game = { path = "../mille_bornes_game" }
monopoly_game = { path = "../monopoly_game" }
shogi_game = { path = "../shogi_game" }
uno_game = { path = "../uno_game" }
xiangqi_game = { path = "../xiangqi_game" }

[[bench]]
name = "session_throughput"
harness = false
