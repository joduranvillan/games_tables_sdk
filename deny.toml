[advisories]
yanked = "warn"
ignore = [
    "RUSTSEC-2025-0141",  # bincode unmaintained, direct/transitive dep
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl" },
    { name = "chrono", reason = "uses unsafe system clock via 'clock' feature" },
    { name = "serde", deny-multiple-versions = true },
    { name = "bevy_ecs", deny-multiple-versions = true },
]

