[advisories]
yanked = "warn"
ignore = [
    "RUSTSEC-2025-0141", # bincode unmaintained
    "RUSTSEC-2024-0384", # instant unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "Zlib",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = [
    { name = "serde", deny-multiple-versions = true },
    { name = "bevy_ecs", deny-multiple-versions = true },
]

