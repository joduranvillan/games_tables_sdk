[advisories]
yanked = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl" },
    { name = "chrono", features = ["clock"] },
    { name = "serde", deny-multiple-versions = true },
    { name = "bevy_ecs", deny-multiple-versions = true },
]

