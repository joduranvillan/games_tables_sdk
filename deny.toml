[advisories]
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0436",  # paste v1.0.15 unmaintained, no fix available via godot dep chain
    "RUSTSEC-2025-0141",  # bincode 1.x unmaintained, transitive dep via bevy_ecs
    "RUSTSEC-2024-0384",  # instant unmaintained, transitive dep via bevy_tasks
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl" },
    { name = "chrono", reason = "uses unsafe system clock via 'clock' feature" },
    { name = "serde", deny-multiple-versions = true },
    { name = "bevy_ecs", deny-multiple-versions = true },
]

