[package]
name = "chess_game"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "Juego de referencia del OpenTable SDK: ajedrez (chess)."
license = "GPL-3.0-or-later"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["game", "board-game", "chess", "rules", "opentable"]
categories = ["game-engines", "games"]
readme = \"README.md\"

[dependencies]
open_table_core = { path = "../open_table_core", version = "1.1.0" }

open_table_engine = { version = "1.1.0", path = "../open_table_engine" }

open_table_macros = { version = "1.1.0", path = "../open_table_macros" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
bevy_ecs = "0.20"


