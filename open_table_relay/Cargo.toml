[package]
name = "open_table_relay"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "Servidor de salas y retransmisión WebSocket standalone para OpenTable SDK."
license = "GPL-3.0-or-later"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["networking", "websocket", "relay", "board-games", "opentable"]
categories = ["network-programming", "game-engines"]
readme = "README.md"

[dependencies]
# Servicio ELO persistente (./data/ratings.db), API HTTP (8081), TLS/WSS (rustls = "0.23", tokio-rustls = "0.26"),
# JWT HS256 (jsonwebtoken = "9"), Rate Limiting GCRA (governor = "0.6"), Anti-Cheat (chess_game, checkers_game)
# y Métricas Prometheus (metrics = "0.23", metrics-exporter-prometheus = "0.15")
open_table_core = { version = "1.1.0", path = "../open_table_core" }
open_table_engine = { version = "1.1.0", path = "../open_table_engine" }
chess_game = { version = "1.1.0", path = "../chess_game" }
checkers_game = { version = "1.1.0", path = "../checkers_game" }
go_game = { version = "1.1.0", path = "../go_game" }
shogi_game = { version = "1.1.0", path = "../shogi_game" }
xiangqi_game = { version = "1.1.0", path = "../xiangqi_game" }
backgammon_game = { version = "1.1.0", path = "../backgammon_game" }
battleship_game = { version = "1.1.0", path = "../battleship_game" }
ludo_game = { version = "1.1.0", path = "../ludo_game" }
mille_bornes_game = { version = "1.1.0", path = "../mille_bornes_game" }
monopoly_game = { version = "1.1.0", path = "../monopoly_game" }
uno_game = { version = "1.1.0", path = "../uno_game" }
crisis_game = { version = "1.1.0", path = "../crisis_game" }
chinese_checkers_game = { version = "1.1.0", path = "../chinese_checkers_game" }
goose_game = { version = "1.1.0", path = "../goose_game" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
hmac = "0.13.0"
sha2 = "0.11.0"
