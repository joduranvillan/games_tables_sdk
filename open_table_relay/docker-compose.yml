version: "3.9"

services:
  relay:
    build:
      context: ..
      dockerfile: open_table_relay/Dockerfile
    image: open_table_relay:latest
    container_name: open_table_relay
    restart: unless-stopped
    environment:
      OPEN_TABLE_RELAY_ADDR: "0.0.0.0:8080"
      OPEN_TABLE_HTTP_ADDR: "0.0.0.0:8081"
      OPEN_TABLE_RATINGS_DB: "/app/data/ratings.db"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - relay_sqlite_data:/app/data
      - ./certs:/etc/opentable/certs:ro
    expose:
      - "8080"
      - "8081"
    networks:
      - relay_internal

  nginx:
    image: nginx:stable-alpine
    container_name: open_table_nginx
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certs:/etc/opentable/certs:ro
    networks:
      - relay_internal

  prometheus:
    image: prom/prometheus:latest
    container_name: open_table_prometheus
    restart: unless-stopped
    depends_on:
      - relay
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - relay_internal

  grafana:
    image: grafana/grafana:latest
    container_name: open_table_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/opentable_relay.json:ro
      - grafana_data:/var/lib/grafana
    networks:
      - relay_internal

volumes:
  relay_sqlite_data:
  prometheus_data:
  grafana_data:

networks:
  relay_internal:
    driver: bridge
