worker_processes auto;

events {
    worker_connections 2048;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream open_table_ws_backend {
        server relay:8080;
    }

    # Port 80 -> Redirect all HTTP traffic to HTTPS/WSS (443)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # Port 443 -> Reverse Proxy for WSS (relay:8080)
    # Note: Port 8081 (HTTP ELO API) remains accessible only on the internal Docker network (relay:8081)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/opentable.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/opentable.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://open_table_ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
