[package]
name = "open_table_transport_native_bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Capa de protocolo (handshake, identidad, reconexión, timeout) para transportes móviles nativos de OpenTable SDK."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["networking", "mobile", "bridge", "board-games", "opentable"]
categories = ["network-programming", "game-engines"]

[dependencies]
open_table_core = { path = "../open_table_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
