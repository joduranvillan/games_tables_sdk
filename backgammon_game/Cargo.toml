[package]
name = "backgammon_game"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Juego de referencia del OpenTable SDK: Backgammon simplificado. Muestra un tablero de puntos con conteo con signo, barra y bear-off."
license = "MIT OR Apache-2.0"

[dependencies]
open_table_core = { path = "../open_table_core" }
open_table_engine = { path = "../open_table_engine" }
open_table_macros = { path = "../open_table_macros" }
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
bevy_ecs = "0.12"

[dev-dependencies]
serde_json = "1"
proptest = "1"
