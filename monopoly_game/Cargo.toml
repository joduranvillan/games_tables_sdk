[package]
name = "monopoly_game"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Juego de referencia del OpenTable SDK: Monopoly."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["game", "board-game", "monopoly", "trading", "rules"]
categories = ["game-engines", "games"]

[dependencies]
open_table_core = { path = "../open_table_core", version = "1.0.0" }

open_table_engine = { version = "1.0.0", path = "../open_table_engine" }

open_table_macros = { version = "1.0.0", path = "../open_table_macros" }

serde = { version = "1", features = ["derive"] }
typetag = "0.2"
bevy_ecs = "0.19"

[dev-dependencies]
serde_json = "1"
