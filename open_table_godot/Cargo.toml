[package]
name = "open_table_godot"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Puente GDExtension entre OpenTable SDK y Godot/Redot. Expone la Session del motor Rust como un nodo con señales."
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5", features = ["api-custom"] }
serde = { version = "1.0", features = ["derive"] }
open_table_engine = { path = "../open_table_engine", version = "0.1.0" }

open_table_core = { path = "../open_table_core", version = "0.1.0" }

open_table_qr = { path = "../open_table_qr", version = "0.1.0" }

open_table_transport_tcp = { path = "../open_table_transport_tcp", version = "0.1.0" }

open_table_transport_websocket = { path = "../open_table_transport_websocket", version = "0.1.0" }

open_table_transport_native_bridge = { path = "../open_table_transport_native_bridge", version = "0.1.0" }

checkers_game = { path = "../checkers_game", version = "0.1.0" }

shogi_game = { path = "../shogi_game", version = "0.1.0" }

xiangqi_game = { path = "../xiangqi_game", version = "0.1.0" }

go_game = { path = "../go_game", version = "0.1.0" }

uno_game = { path = "../uno_game", version = "0.1.0" }

crisis_game = { path = "../crisis_game", version = "0.1.0" }

chess_game = { path = "../chess_game", version = "0.1.0" }

chinese_checkers_game = { path = "../chinese_checkers_game", version = "0.1.0" }

mille_bornes_game = { path = "../mille_bornes_game", version = "0.1.0" }

backgammon_game = { path = "../backgammon_game", version = "0.1.0" }

monopoly_game = { path = "../monopoly_game", version = "0.1.0" }

ludo_game = { path = "../ludo_game", version = "0.1.0" }

battleship_game = { path = "../battleship_game", version = "0.1.0" }

serde_json = "1.0"
