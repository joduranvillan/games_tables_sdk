[package]
name = "open_table_transport_tcp"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Implementación de Transport sobre TCP para desktop en OpenTable SDK."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["networking", "tcp", "transport", "board-games", "opentable"]
categories = ["network-programming", "game-engines"]

[dependencies]
open_table_core = { path = "../open_table_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"

[dev-dependencies]
checkers_game = { path = "../checkers_game" }
chess_game = { path = "../chess_game" }
open_table_engine = { path = "../open_table_engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
tokio = { version = "1", features = ["full"] }
