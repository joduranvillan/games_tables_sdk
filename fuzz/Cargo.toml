[package]
name = "crisis_game-fuzz"
version = "1.1.0"
publish = false
edition = "2021"
rust-version = "1.82"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
open_table_core = { path = "../open_table_core" }

crisis_game = { package = "open_table_crisis_game", path = "../crisis_game" }

[[bin]]
name = "fuzz_crisis"
path = "fuzz_targets/fuzz_crisis.rs"
test = false
doc = false
