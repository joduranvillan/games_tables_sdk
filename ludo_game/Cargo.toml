[package]
name = "ludo_game"
version = "0.1.0"
edition = "2021"
description = "Juego de referencia del OpenTable SDK: Ludo simplificado. Muestra 2-4 jugadores, movimiento por dado, y captura al pisar la ficha rival."

[dependencies]
open_table_core = { path = "../open_table_core" }
open_table_engine = { path = "../open_table_engine" }
open_table_macros = { path = "../open_table_macros" }
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
bevy_ecs = "0.12"

[dev-dependencies]
serde_json = "1"
