[package]
name = "open_table_macros"
version = "1.0.0"
authors = ["joduranvillan"]
edition = "2021"
rust-version = "1.82"
description = "Proc-macros derive para reducir el boilerplate de open_table_core/open_table_engine: GameCommand, GameEvent, GameResource, GameComponent."
license = "GPL-3.0-or-later"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["board-game", "game-engine", "sdk", "macros", "proc-macro"]
categories = ["game-engines", "game-development"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
open_table_core = { version = "1.0.0", path = "../open_table_core" }
open_table_engine = { path = "../open_table_engine" }
bevy_ecs = "0.20"
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
