[package]
name = "open_table_macros"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Proc-macros derive para reducir el boilerplate de open_table_core/open_table_engine: GameCommand, GameEvent, GameResource, GameComponent."
license = "MIT OR Apache-2.0"
publish = false

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
open_table_core = { path = "../open_table_core" }
open_table_engine = { path = "../open_table_engine" }
bevy_ecs = "0.12"
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
