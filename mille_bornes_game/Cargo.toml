[package]
name = "open_table_mille_bornes_game"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "Juego de referencia del OpenTable SDK: Mil Millas (Mille Bornes)."
license = "GPL-3.0-or-later"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["game", "card-game", "mille-bornes", "rules", "opentable"]
categories = ["game-engines", "games"]
readme = "README.md"

[lib]
name = "mille_bornes_game"
path = "src/lib.rs"

[dependencies]
open_table_core = { path = "../open_table_core", version = "1.1.0" }

open_table_engine = { version = "1.1.0", path = "../open_table_engine" }

open_table_macros = { version = "1.1.0", path = "../open_table_macros" }

serde = { version = "1", features = ["derive"] }
typetag = "0.2"
bevy_ecs = "0.20"

[dev-dependencies]
serde_json = "1"
