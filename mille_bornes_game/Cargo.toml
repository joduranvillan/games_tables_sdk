[package]
name = "mille_bornes_game"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Juego de referencia del OpenTable SDK: Mil Millas (Mille Bornes)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/joduranvillan/games_tables_sdk"
keywords = ["game", "card-game", "mille-bornes", "rules", "opentable"]
categories = ["game-engines", "games"]

[dependencies]
open_table_core = { path = "../open_table_core", version = "0.1.0" }

open_table_engine = { path = "../open_table_engine", version = "0.1.0" }

open_table_macros = { path = "../open_table_macros", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
typetag = "0.2"
bevy_ecs = "0.19"

[dev-dependencies]
serde_json = "1"
