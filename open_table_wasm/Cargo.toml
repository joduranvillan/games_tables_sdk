[package]
name = "open_table_wasm"
version = "1.1.0"
edition = "2021"
rust-version = "1.82"
description = "Puente WebAssembly (wasm-bindgen) entre los 14 motores de OpenTable SDK y la aplicación paralela en React."
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open_table_core = { path = "../open_table_core" }
open_table_engine = { path = "../open_table_engine" }
open_table_qr = { path = "../open_table_qr" }
checkers_game = { path = "../checkers_game" }
chess_game = { path = "../chess_game" }
shogi_game = { path = "../shogi_game" }
xiangqi_game = { path = "../xiangqi_game" }
go_game = { path = "../go_game" }
uno_game = { path = "../uno_game" }
crisis_game = { path = "../crisis_game" }
chinese_checkers_game = { path = "../chinese_checkers_game" }
mille_bornes_game = { path = "../mille_bornes_game" }
backgammon_game = { path = "../backgammon_game" }
monopoly_game = { path = "../monopoly_game" }
ludo_game = { path = "../ludo_game" }
battleship_game = { path = "../battleship_game" }
goose_game = { path = "../goose_game" }
