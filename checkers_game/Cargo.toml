[package]
name = "checkers_game"
version = "0.1.0"
edition = "2021"
description = "Juego de referencia del OpenTable SDK: damas (checkers). Sin vista todavía (no hay open_table_godot aún) - se juega por consola con el ejemplo local_match."

[dependencies]
open_table_core = { path = "../open_table_core" }
open_table_engine = { path = "../open_table_engine" }
open_table_macros = { path = "../open_table_macros" }
serde = { version = "1", features = ["derive"] }
typetag = "0.2"
bevy_ecs = "0.12"

[dev-dependencies]
serde_json = "1"
proptest = "1"

